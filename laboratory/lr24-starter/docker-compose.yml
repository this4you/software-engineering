# Приклад для Завдання 5 (LR-24): курсовий застосунок + база даних разом.
# Використовуй, ТІЛЬКИ якщо твоєму проекту потрібна БД.
# Підняти: docker compose up -d --build
#
# Ключове: застосунок звертається до бази за ІМЕНЕМ сервісу "db" (не localhost).
# Підстав свій порт, образ бази та параметри підключення.

services:
  app:
    build: .                      # збирає образ зі свого Dockerfile у корені
    ports:
      - "8080:8080"               # <-- заміни на порт свого застосунку
    environment:
      # Приклад для Spring Boot (адаптуй під свій застосунок):
      DB_HOST: db                 # ім'я сервісу бази, не localhost!
      DB_PORT: 5432
      DB_NAME: courseworkdb
      DB_USER: postgres
      DB_PASSWORD: secret
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: courseworkdb
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
