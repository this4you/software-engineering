# Стартер для Завдання 9 (LR-23).
# Піднімає PostgreSQL + Adminer однією командою:
#   docker compose up -d
# Adminer відкривається на http://localhost:8081
# У формі входу Adminer вкажи:
#   System:   PostgreSQL
#   Server:   db          <-- ім'я сервісу нижче (всередині Compose сервіси
#                             бачать одне одного за іменем)
#   Username: postgres
#   Password: secret
#   Database: studentdb
# Зупинити й прибрати: docker compose down

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: studentdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
