events {}

http {
    # Docker внутрішній DNS — потрібен щоб nginx міг повторно резолвити
    # service-ім'я 'web' і бачити нові репліки, які з'являються після --scale.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name _;

        location / {
            # Змінна примушує nginx робити DNS-lookup на кожен запит.
            # Docker DNS повертає IP реплік у round-robin порядку — так ми
            # отримуємо балансування навантаження без nginx Plus.
            set $upstream "web:5000";
            proxy_pass http://$upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
